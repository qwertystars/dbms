<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101a15" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Banyan: a private home for your family tree. Every branch has roots."
    />
    <link rel="icon" href="/brand/banyan-favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/banyan-app-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,500..700;1,6..72,500..700&family=Noto+Sans+Bengali:wght@400..700&family=Noto+Sans+Devanagari:wght@400..700&family=Noto+Sans+Tamil:wght@400..700&display=swap"
    />
    <script>
      // Apply a stored theme choice before first paint; otherwise the OS setting applies.
      try {
        var t = localStorage.getItem("bn-theme");
        if (t === "notebook" || t === "slate") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Banyan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
