name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: family_social_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/family_social_test
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/family_social_test
      - run: pnpm build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/family_social_test
          APP_BASE_URL: http://localhost:3000
      - run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/family_social_test
          APP_BASE_URL: http://localhost:3000
          AUTH_JWKS: ${{ secrets.AUTH_JWKS_TEST }}
