services:
  postgres:
    container_name: dbms-postgres-test
    image: postgres:16.3-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: family_social_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d family_social_test"]
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
